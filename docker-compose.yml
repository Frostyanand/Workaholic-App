services:
  postgres:
    image: postgres:16-alpine
    container_name: workaholic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workaholic
      POSTGRES_PASSWORD: workaholic_dev_secret
      POSTGRES_DB: workaholic_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workaholic -d workaholic_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
